<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monoatom - Exact Wave Front</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            width: 600px;
            height: 340px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
            background-color: #000000;
            color: white;
        }

        /* The Wave Canvas */
        #carbonCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Vignette to frame the content without hiding the wave */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, #000000 120%);
            z-index: 1;
            pointer-events: none;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .text-glow {
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
        }

        .font-tech {
            font-family: 'Space Grotesk', sans-serif;
        }

    </style>
</head>
<body>

    <!-- FRONT CARD -->
    <div class="card">
        
        <!-- The Original Hexagon Wave -->
        <canvas id="carbonCanvas"></canvas>
        
        <!-- Subtle Vignette -->
        <div class="vignette"></div>

        <!-- Content -->
        <div class="content-layer">
            
            <!-- Top Branding -->
            <div class="flex justify-between items-start">
                <div class="flex items-center gap-4">
                    <!-- Minimal Hex Logo -->
                    <div class="relative w-10 h-10 flex items-center justify-center">
                        <i data-lucide="hexagon" class="text-white fill-white/10" width="36" height="36" stroke-width="1.5"></i>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
                        </div>
                    </div>
                    
                    <div>
                        <h2 class="text-white font-bold tracking-[0.2em] text-xl leading-none font-tech text-glow">MONOATOM</h2>
                        <p class="text-gray-400 text-[10px] font-mono tracking-[0.4em] uppercase mt-1.5">LABS</p>
                    </div>
                </div>
            </div>

            <!-- Bottom Identity -->
            <div class="relative">
                <!-- Deco Line -->
                <div class="absolute -left-10 top-1/2 w-6 h-[1px] bg-white/30"></div>

                <h1 class="text-3xl font-bold text-white mb-2 font-tech tracking-tight text-glow">SUSHANTH PAATNAIK</h1>
                
                <div class="flex items-center gap-3">
                    <span class="h-[1px] w-8 bg-gradient-to-r from-emerald-500 to-transparent"></span>
                    <p class="text-gray-300 font-mono text-[10px] tracking-widest uppercase font-medium">CO-FOUNDER & CEO</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- GRAPHENE WAVE GENERATOR (EXACT TO REFERENCE) ---
        (function() {
            const canvas = document.getElementById('carbonCanvas');
            const ctx = canvas.getContext('2d');
            
            const width = 600;
            const height = 340;
            const scale = window.devicePixelRatio || 2; 
            canvas.width = width * scale;
            canvas.height = height * scale;
            ctx.scale(scale, scale);

            // --- Configuration from your specific code ---
            const hexRadius = 25; 
            const xSpacing = 60;  
            const ySpacing = 50;  
            
            // Choose a static time that shows the wave curve nicely
            const STATIC_TIME = 2500; 

            const particles = [];
            const rows = Math.ceil(height / ySpacing) + 2;
            const cols = Math.ceil(width / xSpacing) + 2;

            // 1. Generate Grid
            for (let y = -1; y < rows; y++) {
                for (let x = -1; x < cols; x++) {
                    let xPos = x * xSpacing;
                    let yPos = y * ySpacing;

                    if (y % 2 !== 0) {
                        xPos += xSpacing / 2;
                    }

                    particles.push({
                        originX: xPos,
                        originY: yPos,
                        size: hexRadius
                    });
                }
            }

            const drawHexagon = (ctx, x, y, radius) => {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i + (Math.PI / 6);
                    const px = x + radius * Math.cos(angle);
                    const py = y + radius * Math.sin(angle);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.fill(); 
            };

            const render = () => {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                const timeScale = STATIC_TIME * 0.0008;

                particles.forEach(p => {
                    // Exact math from your reference
                    const waveX = Math.sin(p.originY * 0.008 + p.originX * 0.005 + timeScale) * 15;
                    const waveY = Math.cos(p.originX * 0.005 + p.originY * 0.008 + timeScale) * 15;

                    const depth = Math.sin(p.originX * 0.01 + timeScale * 1.5);
                    
                    // Exact opacity range from your reference
                    const opacity = 0.1 + (depth + 1) * 0.25; 

                    const currentX = p.originX + waveX;
                    const currentY = p.originY + waveY;

                    // Exact styling from reference
                    ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.05})`; // The faint fill
                    ctx.lineWidth = 1.5;

                    drawHexagon(ctx, currentX, currentY, p.size);
                });
            };

            render();
        })();
    </script>
</body>
</html>
