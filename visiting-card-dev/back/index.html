            background-color: #f3f4f6;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            width: 600px;
            height: 340px;
            position: relative;
            overflow: hidden;
            border-radius: 12px; /* Slightly sharper corners for modern look */
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
        }

            position: absolute;
            inset: 0;

            z-index: 0;
            opacity: 0.6;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            padding: 2.5rem;
        }

        .left-panel {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-right: 2rem;
            border-right: 1px dashed #e5e7eb;
        }

        .right-panel {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 2rem;
        }

        /* Custom Logo SVG */
        .logo-svg {
            width: 42px;
            height: 42px;
        }
