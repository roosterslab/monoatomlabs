<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monoatom - Front Side</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            width: 600px;
            height: 340px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
            background-color: #050505;
            color: white;
        }

        /* Canvas for the Graphene Wave Effect */
        #waveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6; /* Subtle visibility */
        }

        /* Gradient Overlay to ensure text readability */
        .gradient-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top right, #000000 10%, rgba(0,0,0,0.4) 60%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

    </style>
</head>
<body>

    <!-- FRONT CARD -->
    <div class="card">
        
        <!-- The Static Wave Canvas -->
        <canvas id="waveCanvas"></canvas>
        
        <!-- Overlay -->
        <div class="gradient-overlay"></div>

        <!-- Main Layout -->
        <div class="content-layer">

            <!-- Monoatom Logo - Top Right Corner -->
            <img src="logo.svg" alt="Monoatom Logo" class="absolute top-2 right-2 w-40 h-40 opacity-100" style="filter: invert(1) brightness(0.8) saturate(0.5) hue-rotate(180deg);">

            <!-- Top Branding -->
            <div>
                <div class="border-l-[4px] border-[#64748B] pl-4">
                    <h2 class="text-white font-bold tracking-[0.2em] text-2xl leading-none">MONOATOM</h2>
                    <p class="text-white text-base font-mono tracking-[0.4em] uppercase mt-2">LABS</p>
                </div>
            </div>

            <!-- Bottom Identity -->
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white mb-2 shadow-sm">SUSHANTH PAATNAIK</h1>
                <div class="flex items-center gap-3">
                    <span class="h-[2px] w-8 bg-[#64748B] shadow-[0_0_10px_rgba(100,116,139,0.8)]"></span>
                    <p class="text-[#94A3B8] font-mono text-base tracking-widest uppercase font-semibold">CO-FOUNDER & CEO</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- STATIC HEXAGON WAVE GENERATOR ---
        (function() {
            const canvas = document.getElementById('waveCanvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size (matches card CSS size)
            const width = 600;
            const height = 340;
            
            // Scale for high DPI displays (Retina)
            const scale = window.devicePixelRatio || 2; 
            canvas.width = width * scale;
            canvas.height = height * scale;
            ctx.scale(scale, scale);

            // Configuration
            const hexRadius = 24; 
            const xSpacing = 52;  
            const ySpacing = 46;  
            
            // Static time value to freeze the wave in an aesthetic position
            const STATIC_TIME = 2800; 

            const particles = [];
            const rows = Math.ceil(height / ySpacing) + 2;
            const cols = Math.ceil(width / xSpacing) + 2;

            // 1. Generate Grid Points
            for (let y = -1; y < rows; y++) {
                for (let x = -1; x < cols; x++) {
                    let xPos = x * xSpacing;
                    let yPos = y * ySpacing;

                    // Stagger alternate rows for honeycomb layout
                    if (y % 2 !== 0) {
                        xPos += xSpacing / 2;
                    }

                    particles.push({
                        originX: xPos,
                        originY: yPos,
                        size: hexRadius
                    });
                }
            }

            // 2. Render Loop (Runs once for static print)
            const render = () => {
                ctx.clearRect(0, 0, width, height);
                
                // Dark background base
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, width, height);

                const timeScale = STATIC_TIME * 0.0008;

                particles.forEach(p => {
                    // Calculate wave movement
                    const waveX = Math.sin(p.originY * 0.008 + p.originX * 0.005 + timeScale) * 10;
                    const waveY = Math.cos(p.originX * 0.005 + p.originY * 0.008 + timeScale) * 10;

                    // Depth/Opacity calculation for 3D feel
                    const depth = Math.sin(p.originX * 0.01 + timeScale * 1.5);
                    // Range 0.1 to 0.4 for subtle background effect
                    const opacity = 0.1 + (depth + 1) * 0.15; 

                    const currentX = p.originX + waveX;
                    const currentY = p.originY + waveY;

                    // Draw Hexagon
                    ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.05})`;
                    ctx.lineWidth = 1.5;

                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i + (Math.PI / 6);
                        const px = currentX + p.size * Math.cos(angle);
                        const py = currentY + p.size * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                    ctx.fill();
                });
            };

            // Execute Render
            render();
        })();
    </script>
</body>
</html>
