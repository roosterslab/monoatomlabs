<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monoatom Labs Branding - Exact Fonts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Exact Font Declarations */
        @font-face {
            font-family: 'Fabrikat Kompakt';
            src: url('FabrikatKompakt-Bold.woff2') format('woff2'),
                 url('FabrikatKompakt-Bold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Electrum Base';
            src: url('ElectrumBase-Regular.woff2') format('woff2'),
                 url('ElectrumBase-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            /* Fallback fonts included in case local files aren't found yet */
            font-family: sans-serif; 
        }

        .logo-container {
            text-transform: uppercase;
            line-height: 0.82; 
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .monoatom {
            font-family: 'Fabrikat Kompakt', sans-serif;
            font-size: clamp(3.5rem, 12vw, 7.5rem);
            font-weight: bold;
            letter-spacing: -0.02em;
            display: block;
        }

        .labs {
            font-family: 'Electrum Base', sans-serif;
            font-size: clamp(2.8rem, 9.5vw, 6rem);
            /* Matching the weight from the image: Electrum Base with a bit of presence */
            font-weight: normal; 
            letter-spacing: 0.02em;
            display: block;
            margin-top: 0.05em;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <span class="monoatom">MONOATOM</span>
        <span class="labs">LABS</span>
    </div>

</body>
</html>
