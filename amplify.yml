version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install dependencies at root
        - npm ci
    build:
      commands:
        # Build the app
        - npm run build
  artifacts:
    # Output directory for Vite
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
