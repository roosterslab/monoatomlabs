version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Initialize git submodules (nested)
        - echo "Initializing git submodules..."
        - git submodule update --init --recursive
        # Navigate to app directory
        - cd extra-websites/visiting-card/maker
        # Install dependencies
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: extra-websites/visiting-card/maker/dist
    files:
      - '**/*'
  cache:
    paths:
      - extra-websites/visiting-card/maker/node_modules/**/*
