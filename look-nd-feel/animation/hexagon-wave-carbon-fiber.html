<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Particle Wave - Monoatom Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-black text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Hexagon Wave Component ---
        const HexagonWave = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height;
                let particles = [];
                let animationFrameId;

                const init = () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                    particles = [];

                    // HEXAGONAL GRID CONFIGURATION
                    // To tile correctly, we need specific ratios.
                    // But for a loose "floating plates" effect, we can approximate.
                    const hexRadius = 25; // Visible size
                    const xSpacing = 60;  // Horizontal distance
                    const ySpacing = 50;  // Vertical distance

                    const rows = Math.ceil(height / ySpacing) + 2;
                    const cols = Math.ceil(width / xSpacing) + 2;

                    for (let y = -1; y < rows; y++) {
                        for (let x = -1; x < cols; x++) {
                            let xPos = x * xSpacing;
                            let yPos = y * ySpacing;

                            // Stagger alternate rows
                            if (y % 2 !== 0) {
                                xPos += xSpacing / 2;
                            }

                            particles.push({
                                x: xPos,
                                y: yPos,
                                originX: xPos,
                                originY: yPos,
                                size: hexRadius,
                                phase: Math.random() * Math.PI * 2
                            });
                        }
                    }
                };

                const drawHexagon = (ctx, x, y, radius) => {
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        // Pointy-topped hexagon angles: 30, 90, 150...
                        const angle = (Math.PI / 3) * i + (Math.PI / 6);
                        const px = x + radius * Math.cos(angle);
                        const py = y + radius * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                    // Optional: Very subtle fill
                    ctx.fill();
                };

                const animate = (time) => {
                    ctx.clearRect(0, 0, width, height);

                    // Wave parameters
                    const timeScale = time * 0.0008;

                    particles.forEach((p, i) => {
                        // Calculate smooth wave movement
                        const waveX = Math.sin(p.originY * 0.008 + p.originX * 0.005 + timeScale) * 15;
                        const waveY = Math.cos(p.originX * 0.005 + p.originY * 0.008 + timeScale) * 15;

                        // Depth effect for opacity
                        const depth = Math.sin(p.originX * 0.01 + timeScale * 1.5);

                        // Opacity creates the shimmering effect
                        const opacity = 0.1 + (depth + 1) * 0.25; // Range ~0.1 to 0.6

                        p.x = p.originX + waveX;
                        p.y = p.originY + waveY;

                        // Draw Hexagon
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                        ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.05})`; // Very faint fill
                        ctx.lineWidth = 1.5;

                        drawHexagon(ctx, p.x, p.y, p.size);
                    });

                    animationFrameId = requestAnimationFrame(animate);
                };

                init();
                window.addEventListener('resize', init);
                animationFrameId = requestAnimationFrame(animate);

                return () => {
                    window.removeEventListener('resize', init);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block" />;
        };

        // --- Main App ---
        function App() {
            return (
                <div className="w-full h-screen bg-black overflow-hidden relative">
                    <HexagonWave />
                    <div className="absolute inset-0 z-10 bg-radial-gradient from-transparent to-black pointer-events-none opacity-50"
                        style={{ background: 'radial-gradient(circle at center, transparent 0%, #000 100%)' }}>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
