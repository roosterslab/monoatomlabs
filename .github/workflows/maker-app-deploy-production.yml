name: Maker App - Deploy to Production

on:
  push:
    branches:
      - visiting-card-maker-live
    paths:
      - 'visiting-card-dev/maker/**'
      - '.github/workflows/maker-app-deploy-production.yml'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        type: string

jobs:
  verify-deployment:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "❌ Production deployment cancelled - confirmation not provided"
            exit 1
          fi
          echo "✅ Production deployment confirmed"

  deploy-production:
    name: Deploy to Production (AWS Amplify)
    runs-on: ubuntu-latest
    needs: [verify-deployment]
    if: always() && (needs.verify-deployment.result == 'success' || github.event_name == 'push')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app_url }}

    defaults:
      run:
        working-directory: visiting-card-dev/maker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: visiting-card-dev/maker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --if-present

      - name: Build application for production
        run: npm run build
        env:
          VITE_APP_NAME: 'Visiting Card Maker'
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Trigger Amplify production deployment
        id: deploy
        run: |
          echo "Triggering Amplify production deployment..."
          curl -X POST "${{ secrets.AMPLIFY_PRODUCTION_WEBHOOK_URL }}"

          echo "app_url=https://visiting-card-maker-live.${{ secrets.AMPLIFY_DEFAULT_DOMAIN }}" >> $GITHUB_OUTPUT

      - name: Create deployment summary
        run: |
          echo "### 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: visiting-card-maker-live" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View in AWS Amplify Console](https://console.aws.amazon.com/amplify/home?region=${{ secrets.AWS_REGION || 'us-east-1' }})" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Production deployment completed successfully!"
          else
            echo "❌ Production deployment failed!"
            exit 1
          fi

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: success()

    steps:
      - name: Wait for deployment
        run: |
          echo "Waiting 60 seconds for deployment to propagate..."
          sleep 60

      - name: Check application health
        run: |
          URL="https://visiting-card-maker-live.${{ secrets.AMPLIFY_DEFAULT_DOMAIN }}"
          echo "Checking $URL"

          response=$(curl -s -o /dev/null -w "%{http_code}" $URL)

          if [ $response -eq 200 ]; then
            echo "✅ Application is healthy (HTTP $response)"
          else
            echo "❌ Application health check failed (HTTP $response)"
            exit 1
          fi

      - name: Test smoke scenarios
        run: |
          echo "Running basic smoke tests..."
          # Add your smoke test commands here
          echo "✅ Smoke tests passed"
